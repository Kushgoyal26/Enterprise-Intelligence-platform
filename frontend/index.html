<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enterprise Intelligence Platform</title>
<style>
  :root {
    --ink: #13161C;
    --panel: #1A1E26;
    --panel-2: #20242E;
    --border: #2B303B;
    --text: #E7E5E0;
    --text-dim: #9A9FAC;
    --accent: #C9A24B;
    --accent-dim: #8A6F2E;
    --good: #5FA876;
    --warn: #D4A13D;
    --bad: #C4654A;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ink);
    color: var(--text);
    font-family: var(--sans);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 20px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 14px;
  }

  header h1 {
    font-size: 17px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.01em;
  }

  header .status {
    font-size: 12px;
    color: var(--text-dim);
    font-family: var(--mono);
  }

  header .status.online::before {
    content: "";
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--good);
    margin-right: 6px;
  }

  header .status.offline::before {
    content: "";
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--bad);
    margin-right: 6px;
  }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 28px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }

  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--text-dim);
    max-width: 420px;
  }

  .empty-state h2 {
    color: var(--text);
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .empty-state p {
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 18px;
  }

  .examples {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .example-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 13px;
    text-align: left;
    cursor: pointer;
    font-family: var(--sans);
  }

  .example-btn:hover {
    border-color: var(--accent-dim);
    color: var(--text);
  }

  .turn { display: flex; flex-direction: column; gap: 10px; }

  .question {
    align-self: flex-end;
    background: var(--panel-2);
    padding: 10px 16px;
    border-radius: 10px 10px 2px 10px;
    font-size: 14px;
    max-width: 80%;
  }

  .answer-block {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
  }

  .answer-text {
    font-size: 14px;
    line-height: 1.65;
    white-space: pre-wrap;
  }

  .answer-text strong { color: var(--accent); font-weight: 600; }

  .meta-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .tag {
    font-family: var(--mono);
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 4px;
    background: var(--panel-2);
    color: var(--text-dim);
    border: 1px solid var(--border);
  }

  .confidence {
    font-family: var(--mono);
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 4px;
    font-weight: 600;
  }

  .confidence.high { background: rgba(95,168,118,0.15); color: var(--good); }
  .confidence.mid  { background: rgba(212,161,61,0.15); color: var(--warn); }
  .confidence.low  { background: rgba(196,101,74,0.15); color: var(--bad); }

  .warning-box {
    margin-top: 10px;
    padding: 10px 12px;
    background: rgba(196,101,74,0.08);
    border: 1px solid rgba(196,101,74,0.3);
    border-radius: 6px;
    font-size: 12px;
    color: var(--bad);
    line-height: 1.5;
  }

  .thinking {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 12px;
  }

  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.2s infinite ease-in-out;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes pulse {
    0%, 60%, 100% { opacity: 0.25; }
    30% { opacity: 1; }
  }

  footer {
    border-top: 1px solid var(--border);
    padding: 18px 28px;
  }

  .input-row {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
  }

  #question-input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 14px;
    font-family: var(--sans);
  }

  #question-input:focus {
    outline: none;
    border-color: var(--accent-dim);
  }

  #send-btn {
    background: var(--accent);
    color: var(--ink);
    border: none;
    padding: 0 22px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  #send-btn:not(:disabled):hover { background: #D9B35E; }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>

<header>
  <h1>Enterprise Intelligence Platform</h1>
  <span class="status" id="status">checking connection...</span>
</header>

<main id="chat">
  <div class="empty-state" id="empty-state">
    <h2>Ask a question about your business</h2>
    <p>Answers are generated from your live data — subscriptions, support tickets,
       payments, contracts, policies, and churn predictions.</p>
    <div class="examples">
      <button class="example-btn" onclick="askExample(this)">What is the total MRR for the most recent billing month?</button>
      <button class="example-btn" onclick="askExample(this)">What is our refund policy?</button>
      <button class="example-btn" onclick="askExample(this)">Which customers are most likely to churn?</button>
      <button class="example-btn" onclick="askExample(this)">What is the churn rate by region?</button>
    </div>
  </div>
</main>

<footer>
  <div class="input-row">
    <input id="question-input" type="text" placeholder="Ask about revenue, policies, churn risk..." />
    <button id="send-btn">Ask</button>
  </div>
</footer>

<script>
  const API_URL = "https://enterprise-intelligence-platform-c3pq.onrender.com";
  const chat = document.getElementById("chat");
  const input = document.getElementById("question-input");
  const sendBtn = document.getElementById("send-btn");
  const statusEl = document.getElementById("status");
  const emptyState = document.getElementById("empty-state");

  async function checkHealth() {
    try {
      const res = await fetch(`${API_URL}/`);
      if (res.ok) {
        statusEl.textContent = "connected";
        statusEl.className = "status online";
      } else {
        throw new Error();
      }
    } catch {
      statusEl.textContent = "backend not running — start it with uvicorn";
      statusEl.className = "status offline";
    }
  }
  checkHealth();

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function formatAnswer(text) {
    // bold **text**, and drop a trailing "Sources: ..." line (shown as tags instead)
    let cleaned = text.replace(/\n?\*{0,2}Sources:\*{0,2}.*$/is, "").trim();
cleaned = cleaned.replace(/\*+\s*$/, "").trim();
    cleaned = escapeHtml(cleaned).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    return cleaned;
  }

  function confidenceClass(score) {
    if (score >= 0.8) return "high";
    if (score >= 0.5) return "mid";
    return "low";
  }

  function askExample(btn) {
    input.value = btn.textContent;
    sendQuestion();
  }

  async function sendQuestion() {
    const question = input.value.trim();
    if (!question) return;

    if (emptyState) emptyState.remove();

    const turn = document.createElement("div");
    turn.className = "turn";
    turn.innerHTML = `<div class="question">${escapeHtml(question)}</div>`;
    chat.appendChild(turn);

    const thinking = document.createElement("div");
    thinking.className = "answer-block";
    thinking.innerHTML = `<div class="thinking"><span class="dot"></span><span class="dot"></span><span class="dot"></span> routing &amp; gathering data</div>`;
    turn.appendChild(thinking);

    input.value = "";
    input.disabled = true;
    sendBtn.disabled = true;
    chat.scrollTop = chat.scrollHeight;

    try {
      const res = await fetch(`${API_URL}/ask`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });
      const data = await res.json();

      const confCls = confidenceClass(data.confidence);
      const sourceTags = (data.sources || [])
        .map(s => `<span class="tag">${s.toUpperCase()}</span>`)
        .join("");
      const warningsHtml = (data.warnings && data.warnings.length)
        ? `<div class="warning-box">${data.warnings.map(w => escapeHtml(w)).join("<br>")}</div>`
        : "";

      thinking.innerHTML = `
        <div class="answer-text">${formatAnswer(data.answer)}</div>
        <div class="meta-row">
          ${sourceTags}
          <span class="confidence ${confCls}">confidence ${Math.round(data.confidence * 100)}%</span>
        </div>
        ${warningsHtml}
      `;
    } catch (err) {
      thinking.innerHTML = `<div class="answer-text" style="color: var(--bad)">
        Could not reach the backend. Make sure it's running:<br>
        <code>uvicorn backend.api.main:app --reload</code></div>`;
    } finally {
      input.disabled = false;
      sendBtn.disabled = false;
      input.focus();
      chat.scrollTop = chat.scrollHeight;
    }
  }

  sendBtn.addEventListener("click", sendQuestion);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendQuestion();
  });
</script>

</body>
</html>
